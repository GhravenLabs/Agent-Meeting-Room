# Agent Meeting Room - Release Workflow
# Push a version tag to trigger: git tag v1.8.0 && git push origin v1.8.0

name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller AgentMeetingRoom.spec --noconfirm

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "dist\AgentMeetingRoom.exe")) {
            Write-Error "Build failed - exe not found"
            exit 1
          }
          $size = (Get-Item "dist\AgentMeetingRoom.exe").Length / 1MB
          Write-Host "Build OK - $([math]::Round($size,1)) MB"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentMeetingRoom-Windows-${{ github.ref_name }}
          path: dist/AgentMeetingRoom.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Agent Meeting Room ${{ github.ref_name }}"
          body: |
            ## Agent Meeting Room ${{ github.ref_name }}

            ### Download
            | File | Platform | Notes |
            |------|----------|-------|
            | `AgentMeetingRoom.exe` | Windows 10/11 64-bit | Portable - double-click to run |

            ### Quick start (3 steps)
            1. Install [Ollama](https://ollama.com) - runs the local AI models
            2. Pull at least one model: `ollama pull mistral`
            3. Double-click `AgentMeetingRoom.exe` - browser opens at `http://localhost:5000`

            > **@claude** needs an Anthropic API key. Create `.env` next to the exe:
            > `ANTHROPIC_API_KEY=sk-ant-...`

            ### Add unlimited agents
            Pull any model from [ollama.com/library](https://ollama.com/library), add 5 lines to `agents.py`.
            See [CONTRIBUTING.md](https://github.com/GhravenLabs/Agent-Meeting-Room/blob/main/CONTRIBUTING.md).

            ### What is new
            See [CHANGELOG.md](https://github.com/GhravenLabs/Agent-Meeting-Room/blob/main/CHANGELOG.md)

            ---
            Built automatically on Windows runner - Python 3.11 + PyInstaller
          files: dist/AgentMeetingRoom.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
